name: Refresh SF events
on:
  schedule:
    # 05:17 PDT / 06:17 PST. Change to '17 13 * * 1' for Mondays only.
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-sf-events
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run refresh
      - run: pnpm run build
      - name: Commit validated event snapshot
        run: |
          if git diff --quiet -- public/events.json; then
            echo "Event snapshot unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/events.json
          git commit -m 'data: refresh SF events'
          git push origin HEAD:main
