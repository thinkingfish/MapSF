name: Website
on:
  pull_request:
    paths: ['src/**', 'public/**', 'config/**', 'data/**', 'scripts/**', 'tests/**', 'e2e/**', 'maps/**', 'iOS/MapSF/Resources/BaseMap/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version', 'astro.config.mjs', 'playwright.config.mjs', 'wrangler.jsonc', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'config/**', 'data/**', 'scripts/**', 'tests/**', 'e2e/**', 'maps/**', 'iOS/MapSF/Resources/BaseMap/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version', 'astro.config.mjs', 'playwright.config.mjs', 'wrangler.jsonc', '.github/workflows/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
