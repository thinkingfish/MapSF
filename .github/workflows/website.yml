name: Website
on:
  pull_request:
    paths: ['website/**', 'maps/basemap/**', 'MapSF/Resources/BaseMap/**', 'scripts/update-tiles.sh', '.github/workflows/refresh-tiles.yml', '.github/workflows/website.yml', '.github/workflows/refresh-events.yml']
  push:
    branches: [main]
    paths: ['website/**', 'maps/basemap/**', 'MapSF/Resources/BaseMap/**', 'scripts/update-tiles.sh', '.github/workflows/refresh-tiles.yml', '.github/workflows/website.yml', '.github/workflows/refresh-events.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
