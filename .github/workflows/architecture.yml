name: Architecture diagrams
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version
      - name: Verify source claims and committed SVGs
        run: node scripts/generate-architecture.mjs --check
