name: Archived iOS architecture
on:
  pull_request:
    paths: ['iOS/**', '.node-version', '.github/workflows/architecture.yml']
  push:
    paths: ['iOS/**', '.node-version', '.github/workflows/architecture.yml']
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Verify source claims and committed SVGs
        run: node iOS/scripts/generate-architecture.mjs --check
