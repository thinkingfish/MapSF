<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" role="img" aria-labelledby="title desc">
<title id="title">MapSF / runtime paths</title><desc id="desc">Selected in-process flows · arrows show data or state propagation</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566575"/></marker></defs>
<rect width="1100" height="1160" fill="#fff"/>
<text x="40" y="46" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#243447">MapSF / runtime paths</text>
<text x="40" y="79" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#243447">Selected in-process flows · arrows show data or state propagation</text>
<text x="40" y="128" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#243447">01 / Load album content</text>
<rect x="40" y="153" width="312" height="132" rx="10" fill="#B3CDE3" stroke="#b2bac2"/>
